    <script>
        // Add your GSAP functions here
        function initMarquee() {
          let direction = 1; // 1 = forward, -1 = backward scroll
          const roll1 = roll(".marquee-wrapper .marquee-inner-wrap", { duration: 30 }),
                scroll = ScrollTrigger.create({
                  trigger: document.querySelector('.marquee-wrapper .marquee-inner-wrapper'),
                  onUpdate(self) {
                    if (self.direction !== direction) {
                      direction *= -1;
                      gsap.to([roll1], {
                        timeScale: direction,
                        overwrite: true
                      });
                    }
                    self.direction === -1
                      ? document.querySelector(".marquee-wrapper").classList.remove('flipped')
                      : document.querySelector(".marquee-wrapper").classList.add('flipped');
                  }
                });
      
          function roll(targets, vars, reverse) {
            vars = vars || {};
            vars.ease || (vars.ease = "none");
            const tl = gsap.timeline({
                repeat: -1,
                onReverseComplete() {
                  this.totalTime(this.rawTime() + this.duration() * 10);
                }
              }),
              elements = gsap.utils.toArray(targets),
              clones = elements.map(el => {
                let clone = el.cloneNode(true);
                el.parentNode.appendChild(clone);
                return clone;
              }),
              positionClones = () => elements.forEach((el, i) => gsap.set(clones[i], {
                position: "absolute",
                overwrite: false,
                top: el.offsetTop,
                left: el.offsetLeft + (reverse ? -el.offsetWidth : el.offsetWidth)
              }));
            positionClones();
            elements.forEach((el, i) => tl.to([el, clones[i]], {
              xPercent: reverse ? 100 : -100,
              ...vars
            }, 0));
            window.addEventListener("resize", () => {
              let time = tl.totalTime();
              tl.totalTime(0);
              positionClones();
              tl.totalTime(time);
            });
            return tl;
          }
        }
      
        // Initialize all animations on page load
        window.addEventListener("load", () => {
          initMarquee();
        });
      </script>
