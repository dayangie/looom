<!DOCTYPE html>
<html lang="en">
<head>
    <title>Looom</title>
    <link rel="icon" href="assets/img/logo.png" type="image/png">
    <link rel="stylesheet" href="css/styleguide.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="main-header">
        <div class="logo">
            <img src="assets/img/logo.png" alt="Looom Logo" class="logo-icon">
        </div>
        <nav class="navigation">
            <a href="index.html" class="nav-link">Home</a>
            <a href="#" class="nav-link">Courses</a>
            <a href="#" class="nav-link">Schedule</a>
            <a href="bookmarks.html" class="nav-link">Bookmarks</a>
        </nav>
        <div class="user-icon">
            <img src="assets/img/profile-icon.png" alt="User Icon">
        </div>
    </header>

    <main>
        <h1 class="text-center "><span class="font-secondary font-bigger ">B</span>ookmarks<span class="sparkle"></span></h1>
        
    <div class="courses-section plr-4em mt-50">
        <h2>Courses</h2>

        <div class="gallery" id="gallery">
            <div class="card new" onclick="showSubjectPopup()">+ New Page</div>
        </div>
    
        <!-- Add Subject Popup -->
        <div class="popup" id="subjectPopup">
            <h3 class="text-center" style="padding: 20px;">Add Subject</h3>
            <input type="text" id="subjectName" placeholder="Enter subject name" />
            <div class="actions">
                <button onclick="saveSubject()">Save</button>
                <button onclick="closePopup('subjectPopup')">Cancel</button>
            </div>
        </div>
    
        <!-- Add/Edit Bookmark Popup -->
        <div class="popup" id="bookmarkPopup">
            <h3 id="bookmarkPopupTitle" class="text-center" style="padding: 20px;">Add Bookmark</h3>
            <input type="text" id="bookmarkTitle" placeholder="Title" />
            <input type="file" id="bookmarkFile" />
            <input type="text" id="bookmarkLink" placeholder="Link (optional)" />
            <textarea id="bookmarkNote" placeholder="Notes"></textarea>
            <div class="actions">
                <button onclick="saveBookmark()">Save</button>
                <button onclick="closePopup('bookmarkPopup')">Cancel</button>
            </div>
        </div>
    
        <!-- Folder Layout -->
        <div class="folder-layout" id="folderLayout">
            <button onclick="closeFolder()">Back</button>
             <div class="logo-bookmark"> 
                <img src="assets/img/bookmark.png" alt="Looom Logo" class="logo-bookmark">
            <h2 class="sparkle" id="folderTitle"></h2>
        </div>
            <div class="gallery" id="bookmarkGallery"></div>
            <button onclick="showBookmarkPopup()">+ Add Bookmark</button>
        </div>
    
    </div>
       
        <script>
            let currentSubjectCard;
            let folderLayout = document.getElementById('folderLayout');
            let gallery = document.getElementById('gallery');
            let editingBookmark = null;
    
            // Store subjects and bookmarks
            let subjectsData = {};
    
            function showSubjectPopup() {
                document.getElementById('subjectPopup').classList.add('active');
            }
    
            function saveSubject() {
                const subjectName = document.getElementById('subjectName').value;
                if (subjectName.trim() === '') {
                    alert('Please enter a subject name');
                    return;
                }
    
            const subjectCard = document.createElement('div');
            subjectCard.classList.add('card');
            subjectCard.innerHTML = `
                <p>${subjectName}</p>
                <div class="card-actions">
                    <button class="delete-btn" onclick="deleteSubject(event, this)">Delete</button>
                </div>
            `;
    
            // Klik pada kad hanya membuka folder jika bukan klik pada butang
            subjectCard.addEventListener('click', () => openFolder(subjectCard, subjectName));
            subjectsData[subjectName] = [];
            gallery.insertBefore(subjectCard, document.querySelector('.card.new'));
            closePopup('subjectPopup');
            document.getElementById('subjectName').value = '';
        }
    
    function deleteSubject(event, button) {
        // Hentikan propagasi klik ke kad
        event.stopPropagation();
    
        const subjectCard = button.closest('.card');
        const subjectName = subjectCard.querySelector('p').innerText;
    
        const confirmDelete = confirm(`Are you sure you want to delete "${subjectName}"?`);
        if (confirmDelete) {
            delete subjectsData[subjectName];
            gallery.removeChild(subjectCard);
        }
    }
    
    function closeFolder() {
        folderLayout.classList.remove('active');
    }
    
    function openFolder(card, title) {
        currentSubjectCard = card;
        currentFolderName = title; // Pastikan nama folder diselaraskan
        folderLayout.classList.add('active');
        document.getElementById('folderTitle').innerText = currentFolderName; // Nama folder yang dipaparkan
        displayBookmarks(currentFolderName); // Paparkan bookmark subjek
    
        console.log('Subjects Data:', subjectsData);
        console.log('Current Folder Name:', currentFolderName);
    }
    
    
            function showBookmarkPopup() {
                document.getElementById('bookmarkPopup').classList.add('active');
            }
    
            function saveBookmark() {
            const title = document.getElementById('bookmarkTitle').value;
            const fileInput = document.getElementById('bookmarkFile');
            const file = fileInput.files[0];
            const link = document.getElementById('bookmarkLink').value;
            const note = document.getElementById('bookmarkNote').value;
    
            if (title.trim() === '') {
                alert('Please enter a title');
                return;
            }
    
            const subjectName = document.getElementById('folderTitle').innerText;
    
            // Jika sedang mengedit bookmark
            if (editingBookmark !== null) {
                const bookmarkIndex = editingBookmark.dataset.index;
                subjectsData[subjectName][bookmarkIndex] = { title, note, link, file };
                editingBookmark = null;
            } else {
                // Simpan bookmark baharu
                const bookmark = { title, note, link, file };
                subjectsData[subjectName].push(bookmark);
            }
    
            displayBookmarks(subjectName);
    
            closePopup('bookmarkPopup');
            document.getElementById('bookmarkTitle').value = '';
            fileInput.value = '';
            document.getElementById('bookmarkLink').value = '';
            document.getElementById('bookmarkNote').value = '';
        }
    
        function displayBookmarks(subjectName) {
        const bookmarkGallery = document.getElementById('bookmarkGallery');
        bookmarkGallery.innerHTML = ''; // Kosongkan gallery sebelum menambah bookmark
    
        // Semak jika terdapat bookmark untuk subjek tersebut
        if (subjectsData[subjectName]) {
            subjectsData[subjectName].forEach((bookmark, index) => {
                const bookmarkCard = document.createElement('div');
                bookmarkCard.classList.add('bookmark-card');
    
                let filePreview = '';
                if (bookmark.file) {
                    const fileURL = URL.createObjectURL(bookmark.file);
                    filePreview = `<img src="${fileURL}" alt="Preview" style="max-width: 100%; border-radius: 8px; margin-bottom: 10px;" />`;
                }
    
                const linkHTML = bookmark.link
                    ? `<a href="${bookmark.link}" target="_blank">${bookmark.link}</a>`
                    : '';
    
                bookmarkCard.innerHTML = `
                    <p><strong>${bookmark.title}</strong></p>
                    ${filePreview}
                    <p>${bookmark.note}</p>
                    <p><a href="${bookmark.link}" target="_blank">${bookmark.link}</a></p>
                    <div class="actions">
                        <button onclick="editBookmark('${subjectName}', ${index})">Edit</button>
                        <button onclick="downloadBookmark('${subjectName}', ${index})">Download</button>
                        <button onclick="deleteBookmark('${subjectName}', ${index})">Delete</button>
                    </div>
                `;
    
                bookmarkGallery.appendChild(bookmarkCard);
            });
        }
    }
    
        function editBookmark(subjectName, index) {
            const bookmark = subjectsData[subjectName][index];
            document.getElementById('bookmarkTitle').value = bookmark.title;
            document.getElementById('bookmarkLink').value = bookmark.link;
            document.getElementById('bookmarkNote').value = bookmark.note;
    
            editingBookmark = { dataset: { index } }; // Simpan rujukan untuk editing
            document.getElementById('bookmarkPopup').classList.add('active');
        }
    
        function downloadBookmark(subjectName, index) {
            const bookmark = subjectsData[subjectName][index];
            if (bookmark.file) {
                const fileURL = URL.createObjectURL(bookmark.file);
                const a = document.createElement('a');
                a.href = fileURL;
                a.download = bookmark.file.name;
                a.click();
            } else {
                alert('No file available for download.');
            }
        }
    
        function deleteBookmark(subjectName, index) {
            const confirmDelete = confirm('Are you sure you want to delete this bookmark?');
            if (confirmDelete) {
                subjectsData[subjectName].splice(index, 1);
                displayBookmarks(subjectName);
            }
        }
    
            function closePopup(popupId) {
                document.getElementById(popupId).classList.remove('active');
            }
        </script>
    
    </main>
<!-- <div style="height: 150px;"></div> -->
<footer>

        <div class="footer-text">
            <p class="font-yellow">copyright &copy; 2024 looom sdn bhd </p>

        <div class="footer-logo">
            <p class="big font-dmserif font-pink">looom ✿</p>

</footer>

</body>
</html>
